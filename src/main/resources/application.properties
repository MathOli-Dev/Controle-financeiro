spring.application.name=controle-financeiro
server.port=8080

# Banco padrão: H2 em arquivo (dados persistem em ./data). Para PostgreSQL use o perfil "postgres".
spring.datasource.url=jdbc:h2:file:./data/financeiro;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# Popula categorias, lançamentos e metas de exemplo quando o banco está vazio
app.seed-demo-data=true
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
